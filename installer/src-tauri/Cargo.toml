[package]
name = "cartouche-installer"
version = "0.2.0"
description = "Installs Cartouche on an iPhone from a Mac or a PC"
authors = ["Cartouche contributors", "nab138 (iloader)"]
license = "MIT"
repository = "https://github.com/clabeuhtegrite/Cartouche"
edition = "2024"

# A fork of iloader (https://github.com/nab138/iloader, MIT), which does the
# work through isideload and idevice: see ../README.md.

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's, which
# Cargo needs on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "cartouche_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.68", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.5.2", features = ["fs-storage"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
tauri-plugin-store = "2"
futures = "0.3.31"
once_cell = "1.21.3"
tauri-plugin-dialog = "2"
reqwest = "0.13.2"
tokio = "1.49.0"
chrono = "0.4"
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
tracing-appender = "0.2"
rustls = "0.23.36"
plist = "1.8.0"
plist-macro = "0.1.6"
tokio-util = "0.7.18"
rootcause = "0.12.1"
thiserror = "2.0.18"
strum = { version = "0.28.0", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# The versions isideload uses: to check the IPA it downloads, and read
# Cartouche's identifier in an IPA the player picks.
sha2 = "0.11.0"
hex = "0.4.3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# The same local signing and PKCS#12 implementations already used by isideload.
apple-codesign-quick = "=0.1.0"
p12-keystore = { package = "isideload-p12-keystore", version = "=0.3.0-rc4" }
rsa = "0.9.10"
x509-cert = "0.2.5"
tempfile = "3"
aes-gcm = "=0.11.1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
cartouche-installer-fakes = { path = "fakes" }

[features]
# The window as it ships, its frontend built in from ../dist, for the
# interface's tests: `cargo test --features ui-tests --test ui` (README.md).
ui-tests = ["tauri/custom-protocol"]

# Its own main(): the webview's event loop must run on the main thread.
[[test]]
name = "ui"
path = "tests/ui/main.rs"
harness = false
required-features = ["ui-tests"]

# isideload makes the certificate's RSA key in these: unoptimized, as in
# `cargo test` and `tauri dev`, that takes seconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3
