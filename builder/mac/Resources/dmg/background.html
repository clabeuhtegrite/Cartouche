<!doctype html>
<!-- The background of Cartouche Builder's disk image (make_dmg.sh,
     settings.py), rendered with Chromium and the Inter font at 660 x 448,
     background.png, and at twice that, background@2x.png. -->
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 660px; height: 448px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Inter", sans-serif;
    color: #fff;
    /* Top to bottom, so that the row of the icons' names (y 266 to 292) is
       one colour of relative luminance 0.18: Finder's black names (light)
       and white names (dark) both read on it at 4.5:1. */
    background: linear-gradient(180deg, #4F46E5 0px, #EC4899 420px);
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(40px); }
  .glow.one { left: -80px; top: -120px; width: 360px; height: 260px; background: rgba(255,255,255,0.16); }
  .glow.two { right: -60px; top: -100px; width: 300px; height: 220px; background: rgba(255,255,255,0.10); }
  h1 { position: absolute; left: 0; right: 0; top: 30px; margin: 0; text-align: center;
       font-family: "Inter Display", "Inter", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.4px;
       text-shadow: 0 1px 12px rgba(30, 27, 75, 0.25); }
  .sub { position: absolute; left: 0; right: 0; top: 74px; text-align: center; font-weight: 500; font-size: 14px;
         color: rgba(255,255,255,0.92); }
  .sub span { color: rgba(255,255,255,0.72); font-weight: 400; }
  .slot { position: absolute; width: 140px; height: 140px; border-radius: 34px; top: 126px;
          background: rgba(255,255,255,0.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.20); }
  .slot.app { left: 100px; }
  .slot.apps { left: 420px; }
  svg.arrow { position: absolute; left: 262px; top: 172px; }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 38px; white-space: nowrap;
          padding: 8px 14px; border-radius: 12px; background: rgba(23, 18, 61, 0.42);
          font-size: 11px; line-height: 15px; text-align: center; color: rgba(255,255,255,0.95); }
  .hint b { font-weight: 600; }
  .hint .en { color: rgba(255,255,255,0.78); }
</style></head>
<body>
  <div class="glow one"></div><div class="glow two"></div>
  <h1>Cartouche Builder</h1>
  <div class="sub">Glissez l’app dans Applications <span>· Drag the app to Applications</span></div>
  <div class="slot app"></div><div class="slot apps"></div>
  <svg class="arrow" width="136" height="56" viewBox="0 0 136 56" fill="none">
    <path d="M8 28 H116" stroke="rgba(255,255,255,0.9)" stroke-width="7" stroke-linecap="round"/>
    <path d="M100 11 L122 28 L100 45" stroke="rgba(255,255,255,0.9)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="hint">
    <div>Au premier lancement : <b>Réglages Système › Confidentialité et sécurité › Ouvrir quand même</b></div>
    <div class="en">The first time: System Settings › Privacy &amp; Security › Open Anyway</div>
  </div>
</body></html>
