[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cartouche-guard"
version = "0.2.0"
description = "Refuses to publish anything that looks like game content, keys or firmware"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.18"]

[project.scripts]
cartouche-guard = "cartouche_guard.cli:main"

[tool.setuptools.packages.find]
include = ["cartouche_guard*"]
