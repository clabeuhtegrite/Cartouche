# Research for the pull request that turns a game upright on an iPhone, in
# Cartouche's place too; removed before the pull request. A game as nxnative
# builds it, its Info.plist sideways only on an iPhone and every way on an
# iPad, its view controller every way, run in the iOS Simulator with
# launcher/Guest/CartoucheUprightGame.m, as LiveContainerShared loads it in a
# game started in Cartouche's place, and with LiveContainer's few calls it
# makes stood in (Sources/LiveContainerStandIn.m). run.sh builds it, starts
# it on an iPhone held upright without the file's calls and with them, and
# keeps what the game's screen shows.

name: InPlaceGame
options:
  bundleIdPrefix: io.github.clabeuhtegrite
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_ENABLE_OBJC_ARC: "YES"
    CLANG_ENABLE_MODULES: "YES"
targets:
  InPlaceGame:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Build/LiveContainer/LiveContainer/Tweaks/Cartouche/CartoucheUprightGame.m
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clabeuhtegrite.cartouche.inplace-game
        PRODUCT_NAME: InPlaceGame
        MARKETING_VERSION: "1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Game
        HEADER_SEARCH_PATHS: $(SRCROOT)/Build/LiveContainer/LiveContainer
