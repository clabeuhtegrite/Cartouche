# The launcher's gallery: the console screens of launcher/Sources in a small
# app of their own, with LiveContainer's types stood in for
# (Sources/GalleryStubs.swift), so that the iOS Simulator can show them.
# capture.sh opens it on each scenario of scenarios.json and saves the
# screen.
#
#     launcher/Gallery/capture.sh OUT     # XcodeGen and Xcode, on a Mac
#
# CartoucheGalleryUITests (UITests) opens the gallery on the whole console
# and drives it, as a player would: uitests.sh runs them.
#
#     launcher/Gallery/uitests.sh OUT
#
# The Launcher screens workflow runs both on every pull request that changes
# the gallery, the launcher's sources or the catalog it shows, once for each
# version of those changes: a rebase that leaves them as they were keeps the
# results of before.

name: CartoucheGallery
options:
  bundleIdPrefix: io.github.clabeuhtegrite
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Signed to run on this Mac alone, without a team: the iOS Simulator
    # then gives the gallery a keychain, which the launcher shares with the
    # built-in SideStore and the UI tests' sign-in reads.
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CartoucheGallery:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Sources
        includes:
          - "Cartouche*.swift"
        excludes:
          # The game actions, the game behind the console and the telemetry
          # need LiveContainer: its installer, its launcher, its scenes of a
          # game's own process and its list of apps.
          - "CartoucheGameActions.swift"
          - "CartoucheGameHost.swift"
          - "CartoucheTelemetry.swift"
      - path: ../Sources/Cartouche.xcstrings
        buildPhase: resources
      - path: Build/CartoucheCatalog
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clabeuhtegrite.cartouche.gallery
        PRODUCT_NAME: CartoucheGallery
        # Cartouche's version in the screens that show it, such as an update
        # on offer.
        MARKETING_VERSION: "0.3.0"
        GENERATE_INFOPLIST_FILE: "YES"
        # What the generated Info.plist cannot say: the keychain's service,
        # and the Documents the Files picker shows.
        INFOPLIST_FILE: Gallery-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Gallery
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        # Upright or sideways on an iPhone, such as the iPhone Duo simulator;
        # upright on the iPad, which draws the other scenarios at their size.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Gallery-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG CARTOUCHE_GALLERY"
        SWIFT_STRICT_CONCURRENCY: minimal
  CartoucheGalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: CartoucheGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clabeuhtegrite.cartouche.gallery.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: CartoucheGallery
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  CartoucheGallery:
    build:
      targets:
        CartoucheGallery: all
        CartoucheGalleryUITests: [test]
    test:
      config: Debug
      targets:
        - CartoucheGalleryUITests
