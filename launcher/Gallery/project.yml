# The launcher's gallery: the console screens of launcher/Sources in a small
# app of their own, with LiveContainer's types stood in for
# (Sources/GalleryStubs.swift), so that the iOS Simulator can show them.
# capture.sh opens it on each scenario of scenarios.json and saves the
# screen.
#
#     launcher/Gallery/capture.sh OUT     # XcodeGen and Xcode, on a Mac
#
# The Launcher screens workflow runs it on every pull request that touches
# the launcher or the catalog.

name: CartoucheGallery
options:
  bundleIdPrefix: io.github.clabeuhtegrite
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CartoucheGallery:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Sources
        includes:
          - "Cartouche*.swift"
        excludes:
          # The Lab and the system page need LiveContainer and Python, and
          # the game actions LiveContainer's installer and launcher.
          - "CartoucheGameActions.swift"
          - "CartoucheLab.swift"
          - "CartoucheLabView.swift"
          - "CartouchePython.swift"
          - "CartoucheSystemView.swift"
      - path: ../Sources/Cartouche.xcstrings
        buildPhase: resources
      - path: Build/CartoucheCatalog
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clabeuhtegrite.cartouche.gallery
        PRODUCT_NAME: CartoucheGallery
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Gallery
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        # Upright or sideways on an iPhone, such as the iPhone Duo simulator;
        # upright on the iPad, which draws the other scenarios at their size.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Gallery-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG CARTOUCHE_GALLERY"
        SWIFT_STRICT_CONCURRENCY: minimal
schemes:
  CartoucheGallery:
    build:
      targets:
        CartoucheGallery: all
