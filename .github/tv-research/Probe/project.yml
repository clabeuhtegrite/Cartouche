# Research only (the TV mode's thread): a small app that registers a TV
# scene accessory as Cartouche and nxnative do, in the iOS Simulator with an
# external display, and logs what iOS does. Never part of Cartouche; removed
# before the pull request.
name: TVProbe
options:
  bundleIdPrefix: io.github.clabeuhtegrite.research
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  TVProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.clabeuhtegrite.research.tvprobe
        PRODUCT_NAME: TVProbe
        MARKETING_VERSION: "1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
