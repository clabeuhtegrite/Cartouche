name: App

# Builds Cartouche.ipa from a pull request that changes the app, and from
# main after it. Every pull request reports these checks, which main
# requires (.github/rulesets/main.json): one that changes none of the app's
# files skips the build, and a skipped check counts as passed.

on:
  push:
    branches: [main]
    paths: ["app/**", "launcher/**", "!launcher/StorageTests/**", "catalog/**", ".gitmodules", ".github/workflows/app.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Files the app is built from
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Does this change touch them?
        id: paths
        run: |
          # A pull request is checked out as its merge into main: HEAD^1 is
          # main, HEAD^2 the pull request.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILD=false
          while IFS= read -r FILE; do
            case "$FILE" in
              # The release workflow's pull requests change only the source.
              app/sidestore-source.json) ;;
              # The storage tests, which the Storage workflow runs.
              launcher/StorageTests/*) ;;
              app/*|launcher/*|catalog/*|.gitmodules|.github/workflows/app.yml) BUILD=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build the app: $BUILD"

  build:
    name: Build Cartouche.ipa
    needs: changes
    # Builds unless the first job said there is nothing to build, so that a
    # failure there cannot skip it.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    # Xcode 27.2, for the iOS 27.2 SDK: the iPhone Duo gives its whole
    # display only to apps built with Xcode 27 or later.
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      XCODE_VERSION: "27.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid
      # The launcher's parts that need neither LiveContainer nor UIKit
      # (launcher/Package.swift), with their tests, before the app.
      - name: Launcher tests
        run: swift test --package-path launcher
      - name: Build
        run: app/scripts/build.sh
      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cartouche-unsigned-${{ github.sha }}
          path: build/app/Cartouche.ipa
          retention-days: 14
          if-no-files-found: error

  release-checks:
    name: Publish guard and source entry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Cartouche-unsigned-${{ github.sha }}
          path: build/download
      - name: Publish guard
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e guard
          .venv/bin/cartouche-guard --kind app build/download/Cartouche.ipa
      - name: The built-in SideStore's source would take this build
        run: |
          echo '{"name": "Cartouche", "apps": []}' > build/source.json
          echo "Checked by the App workflow." > build/notes.md
          python3 app/scripts/add_release.py --ipa build/download/Cartouche.ipa \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/check/Cartouche.ipa" \
            --notes build/notes.md --source build/source.json
          python3 -m json.tool build/source.json
