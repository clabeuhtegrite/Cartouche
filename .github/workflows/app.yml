name: App

# Builds Cartouche.ipa from a pull request that changes the app. Every pull
# request reports these checks, which main requires
# (.github/rulesets/main.json): one that changes none of the app's files
# skips the build, and a skipped check counts as passed.
#
# The built-in SideStore, about five minutes of the build, changes only with
# its own sources: the build takes it from the Actions cache when one was
# built from the same prepared sources, with the same recipe, Xcode and ldid
# (app/scripts/build.sh --sidestore-cache). A pull request finds the one main
# keeps, or the one its own first run kept. main builds only when what the
# SideStore is built from changes, to keep the one every pull request finds:
# the pull request it comes from has built the rest already. A release builds
# everything again (release.yml), and the Full test pass builds and tests
# everything, whatever the paths (full-pass.yml).
#
# The build runs on Ad's Mac when it can take it now, which spares GitHub's
# Macs, five at a time for the whole account, and their wait; on GitHub's
# otherwise, and always for a run again or the Full test pass
# (.github/mac/README.md).

on:
  push:
    branches: [main]
    # What the built-in SideStore is built from (build.sh --sidestore-key).
    paths:
      - "app/SideStore"
      - "app/patches/sidestore/**"
      - "app/scripts/build.sh"
      - "app/scripts/prepare.sh"
      - "app/scripts/brand.py"
      - "app/scripts/tree_digest.py"
      - "app/config.env"
      - ".gitmodules"
      - ".github/workflows/app.yml"
  pull_request:
  workflow_dispatch:
  # The Full test pass (full-pass.yml): every job, whatever the paths.
  workflow_call:
    inputs:
      full:
        description: "Build and test everything, as the Full test pass does, whatever the paths"
        type: boolean
        default: false

permissions:
  contents: read

# The Full test pass's run is its own: neither a push to main nor a pull
# request cancels it.
concurrency:
  group: ${{ inputs.full && format('app-full-{0}', github.run_id) || format('app-{0}', github.ref) }}
  cancel-in-progress: true

env:
  # Xcode 27.2, for the iOS 27.2 SDK: the iPhone Duo gives its whole display
  # only to apps built with Xcode 27 or later.
  XCODE_VERSION: "27.2"

jobs:
  changes:
    name: Files the app is built from
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.paths.outputs.build }}
      launcher: ${{ steps.paths.outputs.launcher }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Does this change touch them?
        id: paths
        env:
          FULL: ${{ inputs.full }}
        run: |
          # main tested the launcher in the pull request it comes from; the
          # Actions tab and the Full test pass build and test everything.
          if [ "$FULL" = "true" ]; then
            printf 'build=true\nlauncher=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$GITHUB_EVENT_NAME" in
            push) printf 'build=true\nlauncher=false\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
            pull_request) ;;
            *) printf 'build=true\nlauncher=true\n' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # A pull request is checked out as its merge into main: HEAD^1 is
          # main, HEAD^2 the pull request.
          BUILD=false
          LAUNCHER=false
          while IFS= read -r FILE; do
            case "$FILE" in
              # What swift test builds and reads (launcher/Package.swift,
              # launcher/Tests), and the app with it.
              launcher/Package.swift|launcher/Sources/*|launcher/Tests/*|catalog/covers.json|telemetry/test/app-*.json|.github/workflows/app.yml)
                BUILD=true; LAUNCHER=true ;;
              # Read by no build: the notes, the release workflow's pull
              # requests, which change only the source, and what the CI,
              # Storage, Launcher screens and Launcher harness workflows
              # check.
              app/README.md|app/patches/README.md|app/releases/*|app/sidestore-source.json|app/tests/*|launcher/README.md|launcher/StorageTests/*|launcher/Gallery/*|launcher/Harness/*) ;;
              # What the app is built from (app/scripts/prepare.sh and
              # package.sh).
              app/*|.gitmodules|launcher/*|catalog/devices.json|catalog/nxnative.json|catalog/games/*)
                BUILD=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          printf 'build=%s\nlauncher=%s\n' "$BUILD" "$LAUNCHER" >> "$GITHUB_OUTPUT"
          echo "Build the app: $BUILD. Test the launcher: $LAUNCHER."

  # Ad's Mac, when it can take the build now, else GitHub's (route.py).
  route:
    name: Ad's Mac or GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the jobs waiting for Ad's Mac
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      mac: ${{ steps.route.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/mac
          persist-credentials: false
      - name: Where the build runs
        id: route
        env:
          MAC_JOB: Build Cartouche.ipa
          MAC_LABELS: cartouche-build,xcode-${{ env.XCODE_VERSION }}
          RUNNERS_TOKEN: ${{ secrets.MAC_RUNNER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/mac/route.py

  build:
    name: Build Cartouche.ipa
    needs: [changes, route]
    # Builds unless the first job said there is nothing to build, so that a
    # failure there, or in the route, cannot skip it.
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: ${{ fromJSON(needs.route.outputs.runner || '"xcode-27"') }}
    timeout-minutes: 90
    env:
      # brew install takes the formula the runner knows, without updating
      # Homebrew first.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select Xcode
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Select Xcode on Ad's Mac
        if: ${{ runner.environment == 'self-hosted' }}
        run: .github/mac/job.sh xcode "$XCODE_VERSION"
      - name: Install ldid
        if: ${{ runner.environment == 'github-hosted' }}
        run: brew install ldid
      - name: ldid on Ad's Mac
        if: ${{ runner.environment == 'self-hosted' }}
        run: .github/mac/job.sh tool ldid
      # The launcher's parts that need neither LiveContainer nor UIKit
      # (launcher/Package.swift), with their tests, before the app.
      - name: Launcher tests
        if: ${{ needs.changes.outputs.launcher != 'false' }}
        run: swift test --package-path launcher
      # The app's tests that need Foundation, CryptoKit or the iOS SDK, which
      # the CI workflow's App sources job skips on Linux. What they read, the
      # LiveContainer patches and the launcher's sources, builds the app; a
      # change to the tests alone runs them in the Full test pass.
      - name: App tests on macOS
        run: python3 -m unittest discover -s app/tests -p 'test_imported_signing.py' -v
      - name: Prepare the sources
        run: app/scripts/prepare.sh
      # Before the build, which changes the prepared sources.
      - name: The built-in SideStore's key
        id: sidestore
        run: |
          KEY="$(app/scripts/build.sh --prepared --sidestore-key)"
          echo "key=sidestore-$KEY" >> "$GITHUB_OUTPUT"
          echo "The built-in SideStore's key: $KEY"
      - name: Look for that SideStore in the cache
        if: ${{ runner.environment == 'github-hosted' }}
        id: sidestore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/sidestore
          key: ${{ steps.sidestore.outputs.key }}
      # Ad's Mac keeps the SideStores it built on its disk, a folder for each
      # key, which its supervisor prunes: its ldid is not Homebrew's, so its
      # keys are its own.
      - name: Build
        env:
          ON: ${{ runner.environment }}
          KEY: ${{ steps.sidestore.outputs.key }}
        run: |
          CACHE=build/sidestore
          if [ "$ON" = self-hosted ]; then CACHE="$HOME/Library/Caches/cartouche-ci/sidestore/$KEY"; fi
          app/scripts/build.sh --prepared --sidestore-cache "$CACHE"
      # Kept even when the rest of the build fails: build.sh writes the key
      # once the SideStore is built.
      - name: Keep the SideStore in the cache
        if: ${{ !cancelled() && runner.environment == 'github-hosted' && steps.sidestore-cache.outputs.cache-hit != 'true' && hashFiles('build/sidestore/key') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/sidestore
          key: ${{ steps.sidestore.outputs.key }}
      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Cartouche-unsigned-${{ github.sha }}
          path: build/app/Cartouche.ipa
          retention-days: 14
          if-no-files-found: error

  # Beside the build when it runs on Ad's Mac: sends the run back to
  # GitHub's Macs when the Mac loses the build or does not take it (watch.py).
  watch:
    name: Watch Ad's Mac
    needs: [changes, route]
    # Not in the Full test pass, whose build runs on GitHub's Macs.
    if: ${{ !cancelled() && !inputs.full && needs.route.outputs.mac == 'true' && needs.changes.outputs.build != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: read
      actions: write # cancels this run, and starts Mac rescue to run it again
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/mac
          persist-credentials: false
      - name: Watch the build on Ad's Mac
        env:
          MAC_JOB: Build Cartouche.ipa
          MAC_LABELS: cartouche-build,xcode-${{ env.XCODE_VERSION }}
          RUNNERS_TOKEN: ${{ secrets.MAC_RUNNER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/mac/watch.py

  release-checks:
    name: Publish guard and source entry
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Cartouche-unsigned-${{ github.sha }}
          path: build/download
      # The IPA a player signs on the iPhone with their own certificate, as
      # the Release workflow makes it beside this one (docs/imported-signing.md).
      - name: The IPA for the player's own certificate, from this build
        run: python3 app/scripts/own_certificate_ipa.py --ipa build/download/Cartouche.ipa --out build/download/Cartouche-Own-Certificate.ipa
      - name: Publish guard
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e guard
          .venv/bin/cartouche-guard --kind app build/download/Cartouche.ipa build/download/Cartouche-Own-Certificate.ipa
      - name: The built-in SideStore's source would take this build
        run: |
          echo '{"name": "Cartouche", "apps": []}' > build/source.json
          echo "Checked by the App workflow." > build/notes.md
          python3 app/scripts/add_release.py --ipa build/download/Cartouche.ipa \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/check/Cartouche.ipa" \
            --own-certificate-ipa build/download/Cartouche-Own-Certificate.ipa \
            --own-certificate-url "https://github.com/$GITHUB_REPOSITORY/releases/download/check/Cartouche-Own-Certificate.ipa" \
            --notes build/notes.md --source build/source.json
          python3 -m json.tool build/source.json
