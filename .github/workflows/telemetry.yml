name: Telemetry

# Tests the telemetry server (telemetry/README.md) and its weekly sum into the
# game sheets on each pull request that changes them, and deploys the server
# from main to Cloudflare: the Worker and its D1 database in the EU
# jurisdiction (telemetry/deploy.sh). The deploy takes the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID of the environment
# cloudflare, and does nothing while they are not set. Run it by hand for a
# first deploy, once they are. Its secret CARTOUCHE_REPORTS_TOKEN lets the
# Worker file the problems players send in the private repository
# <owner>/cartouche-reports, or the variable CARTOUCHE_REPORTS_REPOSITORY.
# The repository's secrets IGDB_CLIENT_ID and IGDB_CLIENT_SECRET, which the
# Covers workflows use too, let the server find on IGDB the covers of the
# games Cartouche does not know.
# The dashboard, which shows the project what the database holds, goes
# with the server, with the catalog's names and covers: the variables
# CLOUDFLARE_ACCESS_TEAM and CLOUDFLARE_ACCESS_AUD are only for a
# hostname's Access application (telemetry/README.md#dashboard).

on:
  pull_request:
    paths:
      - "telemetry/**"
      - "catalog/schema/game.schema.json"
      - "catalog/nxnative.json"
      - "catalog/covers.json"
      - "catalog/devices.json"
      - ".github/workflows/telemetry.yml"
  push:
    branches: [main]
    paths:
      - "telemetry/**"
      - "catalog/nxnative.json"
      - "catalog/covers.json"
      - "catalog/devices.json"
      - ".github/workflows/telemetry.yml"
  workflow_dispatch:
  # The Full test pass (full-pass.yml): the tests, never the deploy.
  workflow_call:
    inputs:
      full:
        description: "Run the tests, as the Full test pass does, and never deploy"
        type: boolean
        default: false

permissions:
  contents: read

# The Full test pass's run is its own, and waits for no deploy.
concurrency:
  group: ${{ inputs.full && format('telemetry-full-{0}', github.run_id) || format('telemetry-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    name: Telemetry server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The dashboard's Worker imports its page as Workers import a text
      # module: text-modules.mjs lets Node do the same.
      - name: The server's Worker and the dashboard's
        run: node --disable-warning=ExperimentalWarning --import ./telemetry/test/text-modules.mjs --test telemetry/test/worker.test.js telemetry/test/dashboard.test.js
      # The publish guard's dev extra brings jsonschema, for the sheets the
      # weekly sum writes.
      - name: The database on SQLite, the deploy and the weekly sum against a stand-in for Cloudflare
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e "guard[dev]"
          .venv/bin/python -m unittest discover -s telemetry/test -v

  # Not in the Full test pass, which deploys nothing.
  deploy:
    name: Deploy the telemetry server
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CARTOUCHE_REPORTS_TOKEN: ${{ secrets.CARTOUCHE_REPORTS_TOKEN }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          CARTOUCHE_REPORTS_REPOSITORY: ${{ vars.CARTOUCHE_REPORTS_REPOSITORY || format('{0}/cartouche-reports', github.repository_owner) }}
          CLOUDFLARE_ACCESS_TEAM: ${{ vars.CLOUDFLARE_ACCESS_TEAM }}
          CLOUDFLARE_ACCESS_AUD: ${{ vars.CLOUDFLARE_ACCESS_AUD }}
        run: telemetry/deploy.sh
