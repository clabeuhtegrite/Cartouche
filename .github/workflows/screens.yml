name: Launcher screens

# Builds the launcher's gallery (launcher/Gallery) for the iOS Simulator and
# saves a screenshot of each scenario of launcher/Gallery/scenarios.json: the
# console's screens at the sizes of the iPhone 17 Pro and of the iPhone Duo
# folded and unfolded, and on the iPhone Duo simulator itself. They are kept
# with the run, and for a branch of this repository on the branch
# launcher-screens/<branch>, one commit that each run replaces.
#
# A pull request's screenshots are taken once for what it changes in the
# gallery's files: a rebase or a merge of main that leaves those changes as
# they were keeps the ones taken before, about half an hour of a Mac each
# time. Run the workflow from the Actions tab to take them again.
#
# They are taken on Ad's Mac when it can take them now, which spares GitHub's
# Macs, five at a time for the whole account, and their wait; on GitHub's
# otherwise, and always for a run again (.github/mac/README.md).

on:
  pull_request:
    # What the gallery is built from and shows (launcher/Gallery/project.yml
    # and capture.sh).
    paths:
      - "launcher/Sources/**"
      - "launcher/Gallery/**"
      - "catalog/devices.json"
      - "catalog/nxnative.json"
      - "catalog/covers.json"
      - "catalog/games/**"
      - ".github/workflows/screens.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screens-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.2"

jobs:
  # The pull request's changes to the files in the paths above, as its merge
  # into main has them, and whether a run of this pull request took their
  # screenshots already. Its key goes to the Actions cache once they are.
  taken:
    name: Screenshots taken already?
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.changes.outputs.key }}
      taken: ${{ steps.memo.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: What the pull request changes in the gallery's files
        id: changes
        run: |
          # HEAD^1 is main, HEAD the pull request merged into it.
          CHANGES="$(git diff --binary HEAD^1 HEAD -- launcher/Sources launcher/Gallery \
            catalog/devices.json catalog/nxnative.json catalog/covers.json catalog/games \
            .github/workflows/screens.yml | sha256sum | cut -c1-64)"
          echo "key=screens-xcode-$XCODE_VERSION-$CHANGES" >> "$GITHUB_OUTPUT"
      - name: Were their screenshots taken?
        id: memo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/screens-taken
          key: ${{ steps.changes.outputs.key }}
          lookup-only: true
      - name: Say so
        if: ${{ steps.memo.outputs.cache-hit == 'true' }}
        env:
          BRANCH: launcher-screens/${{ github.head_ref }}
        run: |
          echo "::notice::An earlier run took the screenshots of these very changes, on $BRANCH: run this workflow from the Actions tab to take them again."
          echo "The screenshots of these very changes are on \`$BRANCH\` already." >> "$GITHUB_STEP_SUMMARY"

  # Ad's Mac, when it can take them now, else GitHub's (route.py).
  route:
    name: Ad's Mac or GitHub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the jobs waiting for Ad's Mac
    outputs:
      runner: ${{ steps.route.outputs.runner }}
      mac: ${{ steps.route.outputs.mac }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/mac
          persist-credentials: false
      - name: Where the screenshots are taken
        id: route
        env:
          MAC_JOB: Screenshots
          MAC_LABELS: xcode-${{ env.XCODE_VERSION }},ios-sim-${{ env.XCODE_VERSION }}
          RUNNERS_TOKEN: ${{ secrets.MAC_RUNNER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/mac/route.py

  screens:
    name: Screenshots
    needs: [taken, route]
    # Taken unless the first job found them, so that a failure there, or in
    # the route, cannot skip them.
    if: ${{ !cancelled() && needs.taken.outputs.taken != 'true' }}
    runs-on: ${{ fromJSON(needs.route.outputs.runner || '"xcode-27"') }}
    timeout-minutes: 60
    env:
      # brew install takes the formula the runner knows, without updating
      # Homebrew first.
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        if: ${{ runner.environment == 'github-hosted' }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install XcodeGen
        if: ${{ runner.environment == 'github-hosted' }}
        run: brew install xcodegen
      # Its own simulators, which stay from a run to the next, shut down.
      - name: Xcode, XcodeGen and simulators on Ad's Mac
        if: ${{ runner.environment == 'self-hosted' }}
        run: |
          .github/mac/job.sh xcode "$XCODE_VERSION"
          .github/mac/job.sh tool xcodegen
          .github/mac/job.sh simulators
      - name: Take the screenshots
        run: launcher/Gallery/capture.sh build/screens
      - name: Upload them
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launcher-screens
          path: build/screens
          retention-days: 14
          if-no-files-found: warn
      # Once every scenario has its screenshot.
      - name: Note that they are taken
        if: ${{ needs.taken.outputs.key != '' }}
        env:
          SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p build/screens-taken
          echo "$SOURCE" > build/screens-taken/source
      - name: Keep the note in the cache
        if: ${{ needs.taken.outputs.key != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/screens-taken
          key: ${{ needs.taken.outputs.key }}

  # Beside the screenshots when Ad's Mac takes them: sends the run back to
  # GitHub's Macs when the Mac loses them or does not take them (watch.py).
  watch:
    name: Watch Ad's Mac
    needs: [taken, route]
    if: ${{ !cancelled() && needs.route.outputs.mac == 'true' && needs.taken.outputs.taken != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write # cancels this run, and starts Mac rescue to run it again
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/mac
          persist-credentials: false
      - name: Watch the screenshots on Ad's Mac
        env:
          MAC_JOB: Screenshots
          MAC_LABELS: xcode-${{ env.XCODE_VERSION }},ios-sim-${{ env.XCODE_VERSION }}
          RUNNERS_TOKEN: ${{ secrets.MAC_RUNNER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/mac/watch.py

  # The only job that can write runs nothing from the pull request: it
  # commits the screenshots the job above uploaded.
  keep:
    name: Keep the screenshots on a branch
    needs: screens
    if: ${{ !cancelled() && needs.screens.result != 'skipped' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the branch launcher-screens/<branch>
    env:
      BRANCH: launcher-screens/${{ github.head_ref || github.ref_name }}
      SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: launcher-screens
          path: screens
      - name: Push them to launcher-screens/<branch>
        run: |
          cd screens
          git init -q -b screens
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Launcher screens of $SOURCE"
          gh auth setup-git
          git push -q -f "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"
