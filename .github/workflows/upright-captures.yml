name: Upright captures (research)

# Research for the thread of the pull request that turns a game behind the
# console upright on an iPhone, removed before the merge: the launcher's
# harness captures the game's screen on an iPhone 17 Pro held upright
# (launcher/Harness/Tests/UprightCaptures.swift), with a game built before
# 4 November, one that lays itself out upright, and the same with its
# picture on a TV, and runs the tests of the change. The captures go to the
# branch launcher-screens/<branch>-upright, one commit that each run
# replaces, which the Branches workflow deletes.

on:
  push:
    branches: [claude/project-thread-rj9vzr]

permissions:
  contents: read

concurrency:
  group: upright-captures-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.2"

jobs:
  capture:
    name: Captures and the change's harness tests
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      captured: ${{ steps.gather.outputs.captured }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out LiveContainer
        run: git submodule update --init app/LiveContainer
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the harness, take the captures and run the change's tests
        run: |
          launcher/Harness/harness.sh build/harness \
            CartoucheHarnessTests/UprightCaptures \
            CartoucheHarnessTests/UprightTests \
            CartoucheHarnessTests/TVTests
      - name: Gather the captures
        id: gather
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/captures
          if ls launcher/Harness/Tests/UprightCaptures/*.png >/dev/null 2>&1; then
            cp launcher/Harness/Tests/UprightCaptures/*.png build/captures/
          else
            # From the harness app's container, on the simulator the tests ran on.
            UDID="$(xcrun simctl list -j devices booted | python3 -c 'import json, sys; print(next((d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds), ""))')"
            if [ -n "$UDID" ]; then
              DATA="$(xcrun simctl get_app_container "$UDID" io.github.clabeuhtegrite.cartouche.harness data 2>/dev/null || true)"
              if [ -n "$DATA" ] && ls "$DATA"/Library/Logs/UprightCaptures/*.png >/dev/null 2>&1; then
                cp "$DATA"/Library/Logs/UprightCaptures/*.png build/captures/
              fi
            fi
          fi
          cp build/harness/failures.txt build/captures/ 2>/dev/null || true
          grep -h "\[Harness\]" build/harness/console.txt > build/captures/notes.txt 2>/dev/null || true
          ls -la build/captures
          if ls build/captures/*.png >/dev/null 2>&1; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload them
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: upright-captures
          path: build/captures
          retention-days: 7
          if-no-files-found: warn

  keep:
    name: Keep the captures on a branch
    needs: capture
    if: ${{ !cancelled() && needs.capture.outputs.captured == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the branch launcher-screens/<branch>-upright
    env:
      BRANCH: launcher-screens/${{ github.ref_name }}-upright
      SOURCE: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: upright-captures
          path: captures
      - name: Push them to launcher-screens/<branch>-upright
        run: |
          cd captures
          git init -q -b captures
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Upright captures of $SOURCE"
          gh auth setup-git
          git push -q -f "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"
