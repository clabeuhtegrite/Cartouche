name: README screens

# Research only (the thread that presents Cartouche on iPhone, iPad and Mac),
# removed before the merge: screenshots of the launcher's gallery in English,
# for the README's pictures of the iPad and the iPhone. The scenarios are
# .github/readme-screens/scenarios.json, some of launcher/Gallery/scenarios.json
# in English; capture.sh takes them alone, without the UI tests. They go to
# the run's artifact, and in one commit to .github/readme-screens/captures on
# this branch, which starts no workflow (GITHUB_TOKEN).

on:
  push:
    branches: [claude/project-thread-lmacik]
    paths:
      - ".github/readme-screens/scenarios.json"
      - ".github/workflows/readme-screens.yml"

permissions:
  contents: read

concurrency:
  group: readme-screens
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.2"

jobs:
  capture:
    name: Gallery screenshots in English
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: The scenarios, in English
        run: cp .github/readme-screens/scenarios.json launcher/Gallery/scenarios.json
      - name: The screenshots
        run: launcher/Gallery/capture.sh build/readme-screens
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: readme-screens
          path: build/readme-screens
          retention-days: 7
          if-no-files-found: warn

  push:
    name: Commit them on the branch
    needs: capture
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # .github/readme-screens/captures on this branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: readme-screens
          path: downloaded
      - name: Commit and push them
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ls -R downloaded
          mkdir -p .github/readme-screens/captures
          cp downloaded/*.png downloaded/*.txt .github/readme-screens/captures/ 2>/dev/null || true
          git add .github/readme-screens/captures
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Research: the README's screenshots in English, from run $GITHUB_RUN_ID (removed before the merge)"
          gh auth setup-git
          # Fails, rather than overwrite, if the branch has moved since.
          git push -q "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"
