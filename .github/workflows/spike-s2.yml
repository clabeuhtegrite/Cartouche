name: Spike S2

# Phase 2, spike S2 (docs/roadmap.md, engine/spikes/s2/README.md): nxnative's
# rewriter, patch_nso.py, run under CPython for iOS in the iOS simulator on
# synthetic modules that hold no game code, must write the same files as on
# macOS.

on:
  pull_request:
    paths: ["engine/**", ".github/workflows/spike-s2.yml"]
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/spike-s2.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-s2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Rewriter in the iOS simulator
    runs-on: macos-26
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.4"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      # CPython for iOS and Capstone, as Cartouche carries them on the iPhone
      - name: Pinned versions
        run: grep -E '^[A-Z_]+=' engine/spikes/s2/runtime.env >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: nxnative's rewriter at the pinned commit
        run: engine/spikes/s2/fetch_nxnative.sh build/nxnative
      - name: CPython for iOS
        run: engine/spikes/s2/fetch_python_support.sh build/support
      - name: Rewrite on the Mac and in the iOS simulator, and compare
        run: engine/spikes/s2/run_simulator.sh build/support build/nxnative build/s2
