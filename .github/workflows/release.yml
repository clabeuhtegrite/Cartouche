name: Release

# Publishes a release of Cartouche when a tag v<CARTOUCHE_VERSION> is pushed
# on main: builds the IPA, runs the publish guard on it, attaches it to a
# GitHub release, then adds it to app/sidestore-source.json on main, where
# Cartouche's built-in SideStore finds it and offers the update on the iPhone.
# How to cut a release: app/releases/README.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build Cartouche.ipa
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: "26.4"
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check the tag
        id: tag
        run: |
          source app/config.env
          VERSION="${TAG#v}"
          if [ "$VERSION" != "$CARTOUCHE_VERSION" ]; then
            echo "::error::the tag $TAG does not match CARTOUCHE_VERSION=$CARTOUCHE_VERSION in app/config.env"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::the tag $TAG is not on main"
            exit 1
          fi
          if [ ! -s "app/releases/$VERSION.md" ]; then
            echo "::error::app/releases/$VERSION.md, the release notes, is missing"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install ldid
        run: brew install ldid
      - name: Build
        run: app/scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Cartouche-${{ steps.tag.outputs.version }}
          path: build/app/Cartouche.ipa
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish the release and add it to the source
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: Cartouche-${{ needs.build.outputs.version }}
          path: build/download
      - name: Publish guard
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e server
          .venv/bin/cartouche-server check --kind app build/download/Cartouche.ipa
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/release
          IPA="build/release/Cartouche-$VERSION.ipa"
          cp build/download/Cartouche.ipa "$IPA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            # Versions 0.x are test builds: marked as pre-releases on GitHub.
            PRERELEASE=()
            if [ "${VERSION%%.*}" = "0" ]; then PRERELEASE=(--prerelease); fi
            gh release create "$TAG" "$IPA" --title "Cartouche $VERSION" \
              --notes-file "app/releases/$VERSION.md" --verify-tag "${PRERELEASE[@]}"
          fi
      - name: Add the release to the built-in SideStore's source
        run: |
          git fetch --no-tags origin main
          git switch --detach FETCH_HEAD
          python3 app/scripts/add_release.py \
            --ipa "build/release/Cartouche-$VERSION.ipa" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Cartouche-$VERSION.ipa" \
            --notes "app/releases/$VERSION.md" \
            --version "$VERSION"
          git add app/sidestore-source.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Source: Cartouche $VERSION" -m "Added by the Release workflow for $TAG."
          git push origin HEAD:main
