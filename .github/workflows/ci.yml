name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    # The name stays the one main requires (.github/rulesets/main.json).
    name: Server tools and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the publish guard
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e "guard[dev]"
      - name: Tests
        run: .venv/bin/python -m unittest discover -s guard/tests -t guard/tests -v
      - name: Publish guard on the catalog
        run: .venv/bin/cartouche-guard --kind catalog catalog/devices.json catalog/nxnative.json catalog/covers.json catalog/games/*.json
      - name: nxnative's games at the pinned commit
        run: |
          catalog/tools/fetch_nxnative.sh build/nxnative
          python3 -m unittest discover -s catalog/tools -v
          python3 catalog/tools/nxnative_games.py build/nxnative --check catalog/nxnative.json

  app-sources:
    name: App sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out LiveContainer, SideStore, SideSign and SMBClient
        run: |
          git submodule update --init app/LiveContainer app/SideStore app/SMBClient
          git -C app/SideStore submodule update --init Dependencies/SideSign
      - name: Branding tests
        run: python3 -m unittest discover -s app/tests -v
      - name: Copy, patch and brand the pinned sources
        run: app/scripts/prepare.sh

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -x app/scripts/*.sh catalog/tools/*.sh launcher/Gallery/*.sh launcher/StorageTests/*.sh telemetry/*.sh builder/install.sh "builder/Cartouche Builder.command"

  builder:
    name: Cartouche Builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tk and a display, for the window's test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-tk xvfb
      # A fake nxnative (a git repository whose build script writes an IPA of
      # a few bytes) and fake dumps of a few bytes: no game is involved.
      - name: Tests
        working-directory: builder
        run: xvfb-run -a python3 -m unittest discover -s tests -t tests -v

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor finds what lets a workflow leak its token or run what it should
      # not: unpinned actions, kept credentials, expressions in scripts,
      # pull_request_target. Any finding fails the check.
      - name: zizmor
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet zizmor==1.32.0 pyyaml
          .venv/bin/zizmor --offline --no-progress .github/workflows
      - name: main requires only checks that every pull request reports
        run: .venv/bin/python .github/rulesets/check_rulesets.py
