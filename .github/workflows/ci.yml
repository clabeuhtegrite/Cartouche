name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tools and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install the server tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e "server[dev]"
      - name: Tests
        run: .venv/bin/python -m unittest discover -s server/tests -t server/tests -v
      - name: Publish guard on the catalog
        run: .venv/bin/cartouche-server check --kind catalog catalog/devices.json catalog/games/*.json

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck -x app/scripts/*.sh
