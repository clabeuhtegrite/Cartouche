name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Full test pass (full-pass.yml), which runs these jobs as they are.
  workflow_call:
    inputs:
      full:
        description: "Run every job, as the Full test pass does: these always run, whatever the paths"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    # The name stays the one main requires (.github/rulesets/main.json).
    name: Server tools and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the publish guard
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e "guard[dev]"
      - name: Tests
        run: .venv/bin/python -m unittest discover -s guard/tests -t guard/tests -v
      - name: Publish guard on the catalog
        run: .venv/bin/cartouche-guard --kind catalog catalog/devices.json catalog/nxnative.json catalog/covers.json catalog/games/*.json
      - name: nxnative's games at the pinned commit
        run: |
          catalog/tools/fetch_nxnative.sh build/nxnative
          python3 -m unittest discover -s catalog/tools -v
          python3 catalog/tools/nxnative_games.py build/nxnative --check catalog/nxnative.json

  app-sources:
    name: App sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out LiveContainer, SideStore, SideSign, minimuxer and SMBClient
        run: |
          git submodule update --init app/LiveContainer app/SideStore app/SMBClient
          git -C app/SideStore submodule update --init Dependencies/SideSign Dependencies/minimuxer
      - name: Branding tests
        run: python3 -m unittest discover -s app/tests -v
      - name: Copy, patch and brand the pinned sources
        run: app/scripts/prepare.sh

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -x app/scripts/*.sh catalog/tools/*.sh launcher/Gallery/*.sh launcher/Harness/*.sh launcher/StorageTests/*.sh telemetry/*.sh builder/mac/*.sh .github/mac/*.sh .github/mac/cartouche-ci
      # When capture.sh keeps the screen of a scenario: drawn and still, not
      # iOS still opening the gallery (launcher/Gallery/settled.py). And the
      # line a minute of the builds that say nothing, in uitests.sh,
      # capture.sh and the harness (launcher/Gallery/heartbeat.py).
      - name: The gallery's screenshots, and a line a minute from the silent builds
        run: python3 -m unittest discover -s launcher/Gallery -p 'test_*.py' -v

  builder:
    name: Cartouche Builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The engine the Mac app runs (builder/mac, tested and built by
      # Builder), against a fake nxnative (a git repository whose build
      # script writes an IPA of a few bytes) and fake dumps of a few bytes:
      # no game is involved.
      - name: Tests
        working-directory: builder
        run: python3 -m unittest discover -s tests -t tests -v

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor finds what lets a workflow leak its token or run what it should
      # not: unpinned actions, kept credentials, expressions in scripts,
      # pull_request_target. Any finding fails the check.
      - name: zizmor
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet zizmor==1.32.0 pyyaml actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1
          .venv/bin/zizmor --offline --no-progress .github/workflows
      # actionlint checks what GitHub would refuse to start, as a workflow
      # called with an input it does not take, and the scripts with
      # shellcheck (.github/actionlint.yaml).
      - name: actionlint
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/actionlint
      - name: main requires only checks that every pull request reports
        run: .venv/bin/python .github/rulesets/check_rulesets.py
      - name: The branches the Branches workflow deletes
        run: .venv/bin/python -m unittest discover -s .github/branches -v
      - name: The runner on Ad's Mac, and the jobs it takes
        run: .venv/bin/python -m unittest discover -s .github/mac -v
      # The pass runs on main only: here, that it calls every workflow that
      # tests, publishes nothing, and that every release waits for it.
      - name: The full test pass runs every test, and every release waits for it
        run: |
          .venv/bin/python .github/full-pass/wiring.py
          .venv/bin/python -m unittest discover -s .github/full-pass -v

  site:
    name: Showcase site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Games of the catalog with their IGDB images by ID, nothing else loaded
      # from another site, links to this repository, nxnative's and IGDB only,
      # every text in both languages.
      - name: Tests
        run: python3 -m unittest discover -s site/tests -v
