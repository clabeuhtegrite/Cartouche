name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tools and catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the server tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e "server[dev]"
      - name: Tests
        run: .venv/bin/python -m unittest discover -s server/tests -t server/tests -v
      - name: Publish guard on the catalog
        run: .venv/bin/cartouche-server check --kind catalog catalog/devices.json catalog/nxnative.json catalog/covers.json catalog/games/*.json
      - name: nxnative's games at the pinned commit
        run: |
          engine/spikes/s2/fetch_nxnative.sh build/nxnative
          python3 -m unittest discover -s catalog/tools -v
          python3 catalog/tools/nxnative_games.py build/nxnative --check catalog/nxnative.json

  app-sources:
    name: App sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out LiveContainer, SideStore, SideSign and SMBClient
        run: |
          git submodule update --init app/LiveContainer app/SideStore app/SMBClient
          git -C app/SideStore submodule update --init Dependencies/SideSign
      - name: Branding tests
        run: python3 -m unittest discover -s app/tests -v
      - name: Copy, patch and brand the pinned sources
        run: app/scripts/prepare.sh

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -x app/scripts/*.sh engine/spikes/*/*.sh launcher/Gallery/*.sh

  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zizmor finds what lets a workflow leak its token or run what it should
      # not: unpinned actions, kept credentials, expressions in scripts,
      # pull_request_target. Any finding fails the check.
      - name: zizmor
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet zizmor==1.32.0 pyyaml
          .venv/bin/zizmor --offline --no-progress .github/workflows
      - name: main requires only checks that every pull request reports
        run: .venv/bin/python .github/rulesets/check_rulesets.py
