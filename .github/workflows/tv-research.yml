name: TV research

# Research only (the TV mode's thread): what iOS 27 does with a TV scene
# accessory, as Cartouche and nxnative register one, in the Simulator with
# an external display (.github/tv-research). Everything goes to the job's
# log. Removed before the pull request.

on:
  push:
    branches: [claude/project-thread-ft8747]
    paths:
      - ".github/tv-research/**"
      - ".github/workflows/tv-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-research
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.2"

jobs:
  probe:
    name: TV probe
    runs-on: xcode-27
    timeout-minutes: 50
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the probe
        working-directory: .github/tv-research/Probe
        run: |
          xcodegen generate --quiet
          mkdir -p "$GITHUB_WORKSPACE/build"
          xcodebuild build -project TVProbe.xcodeproj -scheme TVProbe -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" -derivedDataPath "$GITHUB_WORKSPACE/build/probe" \
            CODE_SIGN_IDENTITY=- 2>&1 | tee "$GITHUB_WORKSPACE/build/probe.log" | grep -E "error:|\*\* BUILD"
          ls "$GITHUB_WORKSPACE/build/probe/Build/Products/Debug-iphonesimulator"
      - name: Pick the simulators
        id: devices
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          def listing(*args):
              return json.loads(subprocess.run(["xcrun", "simctl", "list", "-j", *args], check=True,
                                               capture_output=True, text=True).stdout)

          def release(runtime):
              try:
                  return tuple(int(n) for n in runtime.get("version", "0").split("."))
              except ValueError:
                  return (0,)

          runtimes = [r for r in listing("runtimes")["runtimes"]
                      if r.get("isAvailable", True) and r.get("platform", "iOS") == "iOS"]
          runtime = max(runtimes, key=lambda r: (release(r), -len(r["identifier"])))
          types = runtime.get("supportedDeviceTypes", [])
          print(f"runtime {runtime['identifier']} {runtime.get('version')}", file=sys.stderr)
          print("types: " + ", ".join(t["name"] for t in types), file=sys.stderr)

          def device(key, choices):
              wanted = next((t for name in choices for t in types if t["name"].startswith(name)), None)
              if wanted is None:
                  print(f"no {key}", file=sys.stderr)
                  return
              for found in listing("devices", "available")["devices"].get(runtime["identifier"], []):
                  if found.get("deviceTypeIdentifier") == wanted["identifier"]:
                      udid = found["udid"]
                      break
              else:
                  udid = subprocess.run(["xcrun", "simctl", "create", "TV probe " + wanted["name"], wanted["identifier"],
                                         runtime["identifier"]], check=True, capture_output=True, text=True).stdout.strip()
              print(f"{key}: {wanted['name']} {udid}", file=sys.stderr)
              print(f"{key}={udid}")

          device("iphone", ["iPhone 17 Pro"])
          device("ipad", ["iPad Pro 13-inch", "iPad Pro", "iPad Air", "iPad"])
          PY
      - name: The probe on the iPhone
        env:
          UDID: ${{ steps.devices.outputs.iphone }}
        run: |
          .github/tv-research/run.sh "$UDID" build/probe/Build/Products/Debug-iphonesimulator/TVProbe.app \
            baseline:12:none none:14 nxnative:16 cartouche:40 baseline:12 late:30:late
      - name: The probe on the iPad
        if: ${{ !cancelled() && steps.devices.outputs.ipad != '' }}
        env:
          UDID: ${{ steps.devices.outputs.ipad }}
        run: |
          .github/tv-research/run.sh "$UDID" build/probe/Build/Products/Debug-iphonesimulator/TVProbe.app \
            baseline:12:none none:14 nxnative:16 cartouche:40
      - name: The build's errors
        if: ${{ failure() }}
        run: grep -E -B2 -A6 "error:" build/probe.log | head -150 || true
