# Research only, on this branch (the TV mode's thread): removed before its
# pull request.
name: TV research

on:
  push:
    branches: [claude/project-thread-ft8747]
    paths:
      - ".github/tv-research/**"
      - ".github/workflows/tv-research.yml"

permissions:
  contents: read

env:
  XCODE_VERSION: "27.2"

jobs:
  probe:
    name: Probe iOS's scene classes
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          xcrun simctl list runtimes
      - name: The SDK's declarations
        run: .github/tv-research/headers.sh
      - name: Probe
        run: .github/tv-research/probe.sh "$RUNNER_TEMP/probe"
