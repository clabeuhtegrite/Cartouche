name: In-place upright (research)

# Research for the thread of the pull request that turns a game upright on an
# iPhone, in Cartouche's place too, removed before the merge: a game as
# nxnative builds it, with launcher/Guest/CartoucheUprightGame.m, started in
# the iOS Simulator on an iPhone held upright, without the file's calls and
# with them (research/inplace/run.sh). The screenshots go to the branch
# launcher-screens/<branch>-inplace, one commit that each run replaces, which
# the Branches workflow deletes.

on:
  push:
    branches: [claude/project-thread-rj9vzr]
    paths:
      - "launcher/Guest/**"
      - "research/inplace/**"
      - ".github/workflows/inplace-captures.yml"

permissions:
  contents: read

concurrency:
  group: inplace-captures-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.2"

jobs:
  capture:
    name: A game in Cartouche's place, upright
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      captured: ${{ steps.gather.outputs.captured }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out LiveContainer
        run: git submodule update --init app/LiveContainer
      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the game and start it, without the file's calls and with them
        run: research/inplace/run.sh build/inplace
      - name: Gather
        id: gather
        if: ${{ !cancelled() }}
        run: |
          ls -la build/inplace || true
          if ls build/inplace/*.png >/dev/null 2>&1; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload them
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: inplace-captures
          path: |
            build/inplace/*.png
            build/inplace/*.json
            build/inplace/log.txt
            build/inplace/build.log
          retention-days: 7
          if-no-files-found: warn

  keep:
    name: Keep the screenshots on a branch
    needs: capture
    if: ${{ !cancelled() && needs.capture.outputs.captured == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the branch launcher-screens/<branch>-inplace
    env:
      BRANCH: launcher-screens/${{ github.ref_name }}-inplace
      SOURCE: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: inplace-captures
          path: captures
      - name: Push them to launcher-screens/<branch>-inplace
        run: |
          cd captures
          rm -f build.log
          git init -q -b captures
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "In-place screenshots of $SOURCE"
          gh auth setup-git
          git push -q -f "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"
